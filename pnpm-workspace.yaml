packages:
  - example

nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

allowBuilds:
  lefthook: true

patchedDependencies:
  "@expo/metro-config": patches/@expo__metro-config.patch

minimumReleaseAgeExclude:
  - "@expo/cli@57.0.9"
  - "@expo/metro-config@57.0.6"
  - "@expo/prebuild-config@57.0.8"
  - expo-asset@57.0.6
  - expo-constants@57.0.6
  - expo-modules-autolinking@57.0.8
  - expo-modules-core@57.0.6
  - expo@57.0.7

overrides:
  basic-ftp: 6.2.4
  baseline-browser-mapping: 2.11.0
  body-parser: 1.20.9
  browserslist: 4.28.7
  compression: 1.8.2
  fast-xml-parser: 5.12.1
  glob: 14.0.2
  joi: 17.13.9
  js-yaml: 4.3.2
  launch-editor: 2.14.2
  minimatch: 11.0.1
  qs: 6.16.1
  shell-quote: 1.11.0
  tinypool: 2.1.2
  undici: 7.30.1
